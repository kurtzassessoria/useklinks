<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLINKS · Pagamento recebido</title><meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121212;color:#fff;font:16px/1.55 Manrope,system-ui,sans-serif;padding:24px}
a{color:#ff6a1f}a:hover{color:#fff}
.c{width:100%;max-width:480px;text-align:center}
.ok{width:72px;height:72px;border-radius:50%;background:#e8590c;display:grid;place-items:center;margin:0 auto 22px}
h1{font:400 clamp(38px,9vw,56px)/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:0}
p{color:#cfcfcf;margin:14px 0 26px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.o{display:flex;align-items:center;gap:14px;text-align:left;background:#1d1d1d;border-radius:18px;padding:18px;text-decoration:none;color:#fff;box-shadow:inset 0 0 0 1px #ffffff14;transition:box-shadow .15s}
.o:hover{color:#fff;box-shadow:inset 0 0 0 2px #e8590c}.o.hi{background:#fff;color:#121212}.o.hi:hover{color:#121212}
.o b{display:block;font-size:16px}.o span{font-size:13.5px;opacity:.75}
.o i{margin-left:auto;font-style:normal;font:400 22px Anton;color:#e8590c}
small{display:block;margin-top:22px;color:#8a8a8a;font-size:13px}
</style></head><body>
<div class="c">
<div class="ok"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
<h1>Pagamento recebido!</h1>
<p id="sub">Bem-vindo ao KLINKS. Agora escolha como quer criar sua página:</p>
<div class="opts">
<a class="o hi" id="self" href="#" target="_blank" rel="noopener"><div><b>Eu mesmo monto</b><span>Receba seu código de acesso no WhatsApp e crie a página em 2 minutos.</span></div><i>→</i></a>
<a class="o" id="kurtz" href="#" target="_blank" rel="noopener"><div><b>Quero que a Kurtz monte</b><span>Mande suas fotos e informações e receba pronta em até 24h.</span></div><i>→</i></a>
</div>
<small>Já recebeu o código? <a href="/cadastro">Criar minha página</a></small>
</div>
<script src="supabase-config.js"></script>
<script>
var q = new URLSearchParams(location.search), plano = (q.get('plano') || '').toLowerCase();
var N = { mensal: 'Mensal', trimestral: 'Trimestral', anual: 'Anual' }[plano];
var WA = String(window.KLINKS_SALES_WHATSAPP || '').replace(/\D/g, '');
var w = function (t) { return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t); };
if (N) document.getElementById('sub').textContent = 'Plano ' + N + ' ativado. Agora escolha como quer criar sua página:';
var base = 'Oi! Acabei de assinar o KLINKS' + (N ? ' (plano ' + N + ')' : '') + '.';
document.getElementById('self').href = w(base + ' Pode me mandar meu código de acesso? Nome do restaurante: ');
document.getElementById('kurtz').href = w(base + ' Quero que a Kurtz monte minha página. Nome do restaurante: ');
</script>
</body></html>
